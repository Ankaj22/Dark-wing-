<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Sign Up - DarkWing</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #151b2d;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #aab3c5;
      margin-bottom: 22px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 1px solid #303a52;
      border-radius: 9px;
      background: #0b1020;
      color: white;
      font-size: 16px;
    }

    .phone-row {
      display: flex;
      gap: 8px;
    }

    .country-code {
      width: 130px;
      flex-shrink: 0;
    }

    .phone-input {
      flex: 1;
    }

    .primary {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0;
      color: #8c96aa;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #303a52;
    }

    .social-btn {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 1px solid #303a52;
      border-radius: 9px;
      background: #20283b;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .message {
      min-height: 20px;
      margin-top: 15px;
      text-align: center;
      color: #ffb4b4;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
    }

    a {
      color: #60a5fa;
      text-decoration: none;
    }

  </style>
</head>

<body>

  <div class="box">

    <h1>👤 Create Account</h1>

    <p class="subtitle">
      Join DarkWing
    </p>


    <!-- EMAIL / USERNAME -->

    <input
      type="text"
      id="username"
      placeholder="Username"
      autocomplete="username"
    >

    <input
      type="email"
      id="email"
      placeholder="Email Address"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Create Password"
      autocomplete="new-password"
    >


    <!-- PHONE NUMBER -->

    <div class="phone-row">

      <select
        id="countryCode"
        class="country-code"
      >

        <option value="+1">🇺🇸 +1</option>
        <option value="+44">🇬🇧 +44</option>
        <option value="+91" selected>🇮🇳 +91</option>
        <option value="+960">🇲🇻 +960</option>
        <option value="+971">🇦🇪 +971</option>
        <option value="+966">🇸🇦 +966</option>
        <option value="+974">🇶🇦 +974</option>
        <option value="+65">🇸🇬 +65</option>
        <option value="+60">🇲🇾 +60</option>
        <option value="+66">🇹🇭 +66</option>
        <option value="+61">🇦🇺 +61</option>
        <option value="+49">🇩🇪 +49</option>
        <option value="+33">🇫🇷 +33</option>

      </select>

      <input
        type="tel"
        id="phone"
        class="phone-input"
        placeholder="Phone Number"
        inputmode="tel"
      >

    </div>


    <!-- CREATE ACCOUNT -->

    <button
      class="primary"
      onclick="createAccount()"
    >
      Create Account
    </button>


    <div class="divider">
      OR SIGN UP WITH
    </div>


    <!-- GOOGLE -->

    <button
      class="social-btn"
      onclick="signupGoogle()"
    >
      🔵 Continue with Google
    </button>


    <!-- FACEBOOK -->

    <button
      class="social-btn"
      onclick="signupFacebook()"
    >
      🔵 Continue with Facebook
    </button>


    <!-- APPLE -->

    <button
      class="social-btn"
      onclick="signupApple()"
    >
       Continue with Apple
    </button>


    <!-- PHONE OTP -->

    <button
      class="social-btn"
      onclick="signupPhone()"
    >
      📱 Continue with Phone Number
    </button>


    <div
      class="message"
      id="message"
    ></div>


    <div class="login-link">

      Already have an account?

      <br><br>

      <a href="/login.html">
        Sign In
      </a>

    </div>

  </div>


  <script>

    async function createAccount() {

      const username =
        document.getElementById("username")
        .value
        .trim();

      const email =
        document.getElementById("email")
        .value
        .trim();

      const password =
        document.getElementById("password")
        .value;

      const countryCode =
        document.getElementById("countryCode")
        .value;

      const phone =
        document.getElementById("phone")
        .value
        .trim();

      const message =
        document.getElementById("message");


      if (!username) {

        message.textContent =
          "Please enter a username.";

        return;

      }


      if (!email) {

        message.textContent =
          "Please enter your email.";

        return;

      }


      if (password.length < 6) {

        message.textContent =
          "Password must be at least 6 characters.";

        return;

      }


      message.style.color = "#ffffff";

      message.textContent =
        "Creating account...";


      try {

        const response =
          await fetch("/api/register", {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              username: username,

              email: email,

              password: password,

              phone: phone
                ? countryCode + phone
                : ""

            })

          });


        const data =
          await response.json();


        if (response.ok) {

          message.style.color =
            "#86efac";

          message.textContent =
            "Account created successfully!";

          setTimeout(function() {

            window.location.href =
              "/login.html";

          }, 1500);

        } else {

          message.style.color =
            "#ffb4b4";

          message.textContent =
            data.error ||
            "Could not create account.";

        }


      } catch (error) {

        message.style.color =
          "#ffb4b4";

        message.textContent =
          "Server error. Please try again.";

      }

    }


    function signupGoogle() {

      window.location.href =
        "/api/auth/google";

    }


    function signupFacebook() {

      window.location.href =
        "/api/auth/facebook";

    }


    function signupApple() {

      window.location.href =
        "/api/auth/apple";

    }


    function signupPhone() {

      const countryCode =
        document.getElementById("countryCode")
        .value;

      const phone =
        document.getElementById("phone")
        .value
        .trim();

      const message =
        document.getElementById("message");


      if (!phone) {

        message.style.color =
          "#ffb4b4";

        message.textContent =
          "Enter your phone number first.";

        return;

      }


      window.location.href =
        "/phone-login.html?phone=" +
        encodeURIComponent(
          countryCode + phone
        );

    }

  </script>

</body>
</html>
