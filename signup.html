<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account - DarkWing</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:#0b1020;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:420px;
  background:#151b2d;
  padding:28px;
  border-radius:18px;
}

h1{
  text-align:center;
  margin:0 0 8px;
}

.subtitle{
  text-align:center;
  color:#aab3c5;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:1px solid #303a52;
  border-radius:9px;
  background:#0b1020;
  color:white;
  font-size:16px;
}

.primary,
.social-btn{
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:9px;
  color:white;
  font-size:16px;
  cursor:pointer;
}

.primary{
  border:none;
  background:#2563eb;
  font-weight:bold;
}

.social-btn{
  border:1px solid #303a52;
  background:#20283b;
}

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:22px 0;
  color:#8c96aa;
  font-size:13px;
}

.divider:before,
.divider:after{
  content:"";
  flex:1;
  height:1px;
  background:#303a52;
}

.message{
  min-height:22px;
  margin-top:15px;
  text-align:center;
}

#phoneSection,
#otpSection{
  display:none;
}

.phone-row{
  display:flex;
  gap:8px;
}

.phone-row input{
  flex:1;
}

.country{
  width:120px;
  padding:14px;
  margin-top:10px;
  border:1px solid #303a52;
  border-radius:9px;
  background:#0b1020;
  color:white;
}

a{
  color:#60a5fa;
  text-decoration:none;
}

.login-link{
  text-align:center;
  margin-top:22px;
}
</style>
</head>

<body>

<div class="box">

<h1>👤 Create Account</h1>

<p class="subtitle">Join DarkWing</p>


<input
  type="email"
  id="email"
  placeholder="Email Address"
>


<input
  type="password"
  id="password"
  placeholder="Create Password (minimum 6 characters)"
>


<button
  class="primary"
  onclick="emailSignup()"
>
Create Account with Email
</button>


<div class="divider">
OR CONTINUE WITH
</div>


<button
  class="social-btn"
  onclick="googleSignup()"
>
🔵 Continue with Google
</button>


<button
  class="social-btn"
  onclick="facebookSignup()"
>
🔵 Continue with Facebook
</button>


<button
  class="social-btn"
  onclick="appleSignup()"
>
 Continue with Apple
</button>


<button
  class="social-btn"
  onclick="showPhone()"
>
📱 Continue with Phone Number
</button>


<div id="phoneSection">

<div class="phone-row">

<select
  id="countryCode"
  class="country"
>

<option value="+1">+1 USA/Canada</option>
<option value="+44">+44 UK</option>
<option value="+91" selected>+91 India</option>
<option value="+960">+960 Maldives</option>
<option value="+971">+971 UAE</option>
<option value="+966">+966 Saudi Arabia</option>
<option value="+974">+974 Qatar</option>
<option value="+65">+65 Singapore</option>
<option value="+60">+60 Malaysia</option>
<option value="+66">+66 Thailand</option>
<option value="+61">+61 Australia</option>
<option value="+49">+49 Germany</option>
<option value="+33">+33 France</option>

</select>


<input
  type="tel"
  id="phone"
  placeholder="Phone Number"
>

</div>


<button
  class="primary"
  onclick="sendOTP()"
>
Send OTP
</button>

</div>


<div id="otpSection">

<input
  type="text"
  id="otp"
  placeholder="Enter OTP"
>


<button
  class="primary"
  onclick="verifyOTP()"
>
Verify OTP
</button>

</div>


<!-- Firebase Phone Auth reCAPTCHA -->

<div id="recaptcha-container"></div>


<div
  class="message"
  id="message"
></div>


<div class="login-link">

Already have an account?

<br><br>

<a href="/login.html">
Sign In
</a>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {

  getAuth,

  createUserWithEmailAndPassword,

  GoogleAuthProvider,

  FacebookAuthProvider,

  OAuthProvider,

  signInWithPopup,

  RecaptchaVerifier,

  signInWithPhoneNumber

}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


/* =========================================
   PASTE YOUR FIREBASE CONFIG HERE
========================================= */

const firebaseConfig = {

  apiKey: "PASTE_YOUR_API_KEY",

  authDomain: "PASTE_YOUR_AUTH_DOMAIN",

  projectId: "PASTE_YOUR_PROJECT_ID",

  storageBucket: "PASTE_YOUR_STORAGE_BUCKET",

  messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID",

  appId: "PASTE_YOUR_APP_ID"

};


/* FIREBASE START */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);


/* MESSAGE */

function showMessage(text,color="#ffb4b4"){

  const message =
    document.getElementById("message");

  message.textContent = text;

  message.style.color = color;

}


/* EMAIL SIGNUP */

window.emailSignup =
async function(){

  const email =
    document.getElementById("email")
    .value
    .trim();

  const password =
    document.getElementById("password")
    .value;


  if(!email || !password){

    showMessage(
      "Enter email and password."
    );

    return;

  }


  if(password.length < 6){

    showMessage(
      "Password must be at least 6 characters."
    );

    return;

  }


  try{

    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );


    showMessage(
      "Account created successfully!",
      "#86efac"
    );


    setTimeout(function(){

      window.location.href =
        "/";

    },1500);


  }catch(error){

    showMessage(
      error.message
    );

  }

};


/* GOOGLE */

window.googleSignup =
async function(){

  try{

    const provider =
      new GoogleAuthProvider();


    await signInWithPopup(
      auth,
      provider
    );


    showMessage(
      "Google login successful!",
      "#86efac"
    );


    setTimeout(function(){

      window.location.href = "/";

    },1000);


  }catch(error){

    showMessage(
      error.message
    );

  }

};


/* FACEBOOK */

window.facebookSignup =
async function(){

  try{

    const provider =
      new FacebookAuthProvider();


    await signInWithPopup(
      auth,
      provider
    );


    showMessage(
      "Facebook login successful!",
      "#86efac"
    );


    setTimeout(function(){

      window.location.href = "/";

    },1000);


  }catch(error){

    showMessage(
      error.message
    );

  }

};


/* APPLE */

window.appleSignup =
async function(){

  try{

    const provider =
      new OAuthProvider(
        "apple.com"
      );


    await signInWithPopup(
      auth,
      provider
    );


    showMessage(
      "Apple login successful!",
      "#86efac"
    );


    setTimeout(function(){

      window.location.href = "/";

    },1000);


  }catch(error){

    showMessage(
      error.message
    );

  }

};


/* SHOW PHONE */

window.showPhone =
function(){

  document
    .getElementById("phoneSection")
    .style.display = "block";

};


/* PHONE RECAPTCHA */

let confirmationResult;

let recaptchaVerifier;


window.sendOTP =
async function(){

  const countryCode =
    document.getElementById("countryCode")
    .value;

  const phone =
    document.getElementById("phone")
    .value
    .trim();


  if(!phone){

    showMessage(
      "Enter your phone number."
    );

    return;

  }


  const fullPhone =
    countryCode + phone;


  try{

    if(!recaptchaVerifier){

      recaptchaVerifier =
        new RecaptchaVerifier(
          auth,
          "recaptcha-container",
          {
            size:"normal"
          }
        );

    }


    confirmationResult =
      await signInWithPhoneNumber(
        auth,
        fullPhone,
        recaptchaVerifier
      );


    document
      .getElementById("otpSection")
      .style.display = "block";


    showMessage(
      "OTP sent successfully!",
      "#86efac"
    );


  }catch(error){

    showMessage(
      error.message
    );

  }

};


/* VERIFY OTP */

window.verifyOTP =
async function(){

  const otp =
    document.getElementById("otp")
    .value
    .trim();


  if(!otp){

    showMessage(
      "Enter OTP."
    );

    return;

  }


  try{

    await confirmationResult.confirm(
      otp
    );


    showMessage(
      "Phone verified successfully!",
      "#86efac"
    );


    setTimeout(function(){

      window.location.href = "/";

    },1000);


  }catch(error){

    showMessage(
      "Invalid OTP. Please try again."
    );

  }

};

</script>

</body>
</html>
