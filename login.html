<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | DARKWING</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: white;
      background:
        radial-gradient(circle at top right, #315f78 0%, transparent 35%),
        linear-gradient(135deg, #071321, #102b40 55%, #1d4054);
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 35px 28px;
      border-radius: 24px;
      background: rgba(12, 29, 45, 0.88);
      border: 1px solid rgba(80, 201, 255, 0.35);
      box-shadow: 0 0 40px rgba(0, 180, 255, 0.15);
      backdrop-filter: blur(15px);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 4px;
      margin-bottom: 10px;
    }

    .logo span {
      color: #52d8ff;
    }

    h1 {
      text-align: center;
      font-size: 26px;
      margin-top: 20px;
    }

    .subtitle {
      text-align: center;
      color: #aab9c5;
      margin: 10px 0 28px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #dce8ef;
    }

    .input-box {
      position: relative;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 15px 48px 15px 15px;
      border-radius: 12px;
      border: 1px solid #31536a;
      outline: none;
      font-size: 16px;
      color: white;
      background: rgba(255,255,255,0.06);
    }

    input:focus {
      border-color: #51d8ff;
      box-shadow: 0 0 0 3px rgba(81,216,255,0.12);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      color: #52d8ff;
      font-size: 18px;
      cursor: pointer;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 5px 0 24px;
      font-size: 13px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #b8c7d1;
    }

    .remember input {
      width: auto;
      accent-color: #2bbff2;
    }

    a {
      color: #52d8ff;
      text-decoration: none;
    }

    .login-btn {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 14px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(90deg, #13b8e8, #1678e8);
      transition: 0.2s;
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .signup {
      text-align: center;
      margin-top: 24px;
      color: #aab9c5;
      font-size: 14px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #8fa4b2;
      font-size: 14px;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      background: rgba(255, 80, 80, 0.12);
      color: #ffb1b1;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">DARK<span>WING</span></div>

    <h1>Welcome Back</h1>
    <p class="subtitle">
      Sign in to access your personal streaming library.
    </p>

    <form id="loginForm">

      <label for="email">Email Address</label>
      <div class="input-box">
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          autocomplete="username"
          required
        >
      </div>

      <label for="current-password">Password</label>
      <div class="input-box">
        <input
          type="password"
          id="current-password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <button
          type="button"
          class="toggle-password"
          id="togglePassword"
          aria-label="Show password"
        >👁</button>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" id="remember">
          Remember me
        </label>

        <a href="forgot-password.html">Forgot Password?</a>
      </div>

      <button type="submit" class="login-btn">
        Login
      </button>

      <div class="message" id="message"></div>

    </form>

    <div class="signup">
      Don't have an account?
      <a href="signup.html">Create Account</a>
    </div>

    <a href="index.html" class="back">← Back to Home</a>

  </div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC8Hfx0E7OpnfclF7UGYVcmdU38yuxtsBY",
  authDomain: "darkwing-a717a.firebaseapp.com",
  projectId: "darkwing-a717a",
  storageBucket: "darkwing-a717a.firebasestorage.app",
  messagingSenderId: "352453390196",
  appId: "1:352453390196:web:c141c98aa05c58133a4621"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const password = document.getElementById("current-password");
const togglePassword = document.getElementById("togglePassword");
const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");

togglePassword.addEventListener("click", function () {
  if (password.type === "password") {
    password.type = "text";
    togglePassword.textContent = "🙈";
  } else {
    password.type = "password";
    togglePassword.textContent = "👁";
  }
});

loginForm.addEventListener("submit", async function (e) {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const userPassword = password.value;

  if (!email || !userPassword) {
    message.style.display = "block";
    message.textContent = "Please enter email and password.";
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, userPassword);

    message.style.display = "block";
    message.style.color = "#86efac";
    message.textContent = "Login successful!";

    setTimeout(function () {
      window.location.href = "/";
    }, 1000);

  } catch (error) {
    message.style.display = "block";
    message.style.color = "#ffb4b4";
    message.textContent = error.message;
  }
});
</script>

</body>
</html>
