<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Create Account - DarkWing</title>

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      font-family:Arial,sans-serif;
      background:#0b1020;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .box{
      width:100%;
      max-width:420px;
      background:#151b2d;
      padding:28px;
      border-radius:18px;
    }

    h1{
      text-align:center;
      margin:0 0 8px;
    }

    .subtitle{
      text-align:center;
      color:#aab3c5;
      margin-bottom:20px;
    }

    input{
      width:100%;
      padding:14px;
      margin-top:10px;
      border:1px solid #303a52;
      border-radius:9px;
      background:#0b1020;
      color:white;
      font-size:16px;
    }

    .primary,
    .social-btn{
      width:100%;
      padding:14px;
      margin-top:12px;
      border-radius:9px;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    .primary{
      border:none;
      background:#2563eb;
      font-weight:bold;
    }

    .social-btn{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:52px;
      border:1px solid #303a52;
      background:#20283b;
    }

    .social-btn img{
      position:absolute;
      left:16px;
      width:22px;
      height:22px;
    }

    .divider{
      display:flex;
      align-items:center;
      gap:10px;
      margin:22px 0;
      color:#8c96aa;
      font-size:13px;
    }

    .divider:before,
    .divider:after{
      content:"";
      flex:1;
      height:1px;
      background:#303a52;
    }

    .message{
      min-height:22px;
      margin-top:15px;
      text-align:center;
    }

    #phoneSection,
    #otpSection{
      display:none;
    }

    .phone-row{
      display:flex;
      gap:8px;
    }

    .phone-row input{
      flex:1;
    }

    .country{
      width:120px;
      padding:14px;
      margin-top:10px;
      border:1px solid #303a52;
      border-radius:9px;
      background:#0b1020;
      color:white;
    }

    .login-link{
      text-align:center;
      margin-top:22px;
    }

    a{
      color:#60a5fa;
      text-decoration:none;
    }

  </style>
</head>

<body>

<div class="box">

  <h1>👤 Create Account</h1>

  <p class="subtitle">
    Join DarkWing
  </p>


  <!-- EMAIL -->

  <input
    type="email"
    id="email"
    placeholder="Email Address"
  >

  <input
    type="password"
    id="password"
    placeholder="Create Password (minimum 6 characters)"
  >

  <button
    class="primary"
    type="button"
    onclick="emailSignup()"
  >
    Create Account with Email
  </button>


  <div class="divider">
    OR CONTINUE WITH
  </div>


  <!-- GOOGLE -->

  <button
    class="social-btn"
    type="button"
    onclick="googleSignup()"
  >

    <img
      src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
      alt="Google"
    >

    Continue with Google

  </button>


  <!-- FACEBOOK -->

  <button
    class="social-btn"
    type="button"
    onclick="facebookSignup()"
  >

    <img
      src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg"
      alt="Facebook"
    >

    Continue with Facebook

  </button>


  <!-- APPLE -->

  <button
    class="social-btn"
    type="button"
    onclick="appleSignup()"
  >

     Continue with Apple

  </button>


  <!-- PHONE -->

  <button
    class="social-btn"
    type="button"
    onclick="showPhone()"
  >
    📱 Continue with Phone Number
  </button>


  <!-- PHONE SECTION -->

  <div id="phoneSection">

    <div class="phone-row">

      <select
        id="countryCode"
        class="country"
      >

        <option value="+91" selected>
          🇮🇳 +91 India
        </option>

        <option value="+960">
          🇲🇻 +960 Maldives
        </option>

        <option value="+1">
          🇺🇸/🇨🇦 +1
        </option>

        <option value="+44">
          🇬🇧 +44 UK
        </option>

        <option value="+971">
          🇦🇪 +971 UAE
        </option>

      </select>


      <input
        type="tel"
        id="phone"
        placeholder="Phone number"
      >

    </div>


    <button
      class="primary"
      type="button"
      onclick="sendOTP()"
    >
      Send OTP
    </button>

  </div>


  <!-- OTP SECTION -->

  <div id="otpSection">

    <input
      type="text"
      id="otp"
      placeholder="Enter OTP"
    >

    <button
      class="primary"
      type="button"
      onclick="verifyOTP()"
    >
      Verify OTP
    </button>

  </div>


  <!-- RECAPTCHA -->

  <div id="recaptcha-container"></div>


  <!-- MESSAGE -->

  <div
    class="message"
    id="message"
  ></div>


  <!-- LOGIN -->

  <div class="login-link">

    Already have an account?

    <br><br>

    <a href="/login.html">
      Sign In
    </a>

  </div>

</div>


<!-- FIREBASE -->

<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {

  getAuth,

  createUserWithEmailAndPassword,

  GoogleAuthProvider,

  FacebookAuthProvider,

  OAuthProvider,

  signInWithPopup,

  RecaptchaVerifier,

  signInWithPhoneNumber

}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey:
  "AIzaSyC8Hfx0E7OpnfclF7UGYVcmdU38yuxtsBY",

  authDomain:
  "darkwing-a717a.firebaseapp.com",

  projectId:
  "darkwing-a717a",

  storageBucket:
  "darkwing-a717a.firebasestorage.app",

  messagingSenderId:
  "352453390196",

  appId:
  "1:352453390196:web:c141c98aa05c58133a4621"

};


/* INITIALIZE */

const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


/* MESSAGE */

function showMessage(
  text,
  color="#ffb4b4"
){

  const message =
    document.getElementById("message");

  message.textContent =
    text;

  message.style.color =
    color;

}


/* EMAIL SIGNUP */

window.emailSignup =
async function(){

  const email =
    document
    .getElementById("email")
    .value
    .trim();


  const password =
    document
    .getElementById("password")
    .value;


  if(!email || !password){

    showMessage(
      "Enter email and password."
    );

    return;

  }


  if(password.length < 6){

    showMessage(
      "Password must be at least 6 characters."
    );

    return;

  }


  try{

    await
    createUserWithEmailAndPassword(
      auth,
      email,
      password
    );


    showMessage(
      "Account created successfully!",
      "#86efac"
    );


    setTimeout(function(){

      window.location.href =
        "/";

    },1500);


  }
  catch(error){

    showMessage(
      error.message
    );

  }

};


/* SOCIAL LOGIN */

async function socialLogin(
  provider,
  successMessage
){

  try{

    await
    signInWithPopup(
      auth,
      provider
    );


    showMessage(
      successMessage,
      "#86efac"
    );


    setTimeout(function(){

      window.location.href =
        "/";

    },1000);


  }
  catch(error){

    showMessage(
      error.message
    );

  }

}


/* GOOGLE */

window.googleSignup =
function(){

  socialLogin(
    new GoogleAuthProvider(),
    "Google login successful!"
  );

};


/* FACEBOOK */

window.facebookSignup =
function(){

  socialLogin(
    new FacebookAuthProvider(),
    "Facebook login successful!"
  );

};


/* APPLE */

window.appleSignup =
function(){

  socialLogin(
    new OAuthProvider("apple.com"),
    "Apple login successful!"
  );

};


/* SHOW PHONE */

window.showPhone =
function(){

  document
    .getElementById("phoneSection")
    .style.display =
    "block";

};


/* PHONE AUTH */

let confirmationResult;

let recaptchaVerifier;


/* SEND OTP */

window.sendOTP =
async function(){

  const phone =
    document
    .getElementById("phone")
    .value
    .trim();


  if(!phone){

    showMessage(
      "Enter your phone number."
    );

    return;

  }


  const countryCode =
    document
    .getElementById("countryCode")
    .value;


  const fullPhone =
    countryCode + phone;


  try{

    if(!recaptchaVerifier){

      recaptchaVerifier =
        new RecaptchaVerifier(
          auth,
          "recaptcha-container",
          {
            size:"normal"
          }
        );

    }


    confirmationResult =
      await signInWithPhoneNumber(
        auth,
        fullPhone,
        recaptchaVerifier
      );


    document
      .getElementById("otpSection")
      .style.display =
      "block";


    showMessage(
      "OTP sent successfully!",
      "#86efac"
    );


  }
  catch(error){

    showMessage(
      error.message
    );

  }

};


/* VERIFY OTP */

window.verifyOTP =
async function(){

  const otp =
    document
    .getElementById("otp")
    .value
    .trim();


  if(!otp){

    showMessage(
      "Enter OTP."
    );

    return;

  }


  if(!confirmationResult){

    showMessage(
      "Please send OTP first."
    );

    return;

  }


  try{

    await
    confirmationResult.confirm(
      otp
    );


    showMessage(
      "Phone verified successfully!",
      "#86efac"
    );


    setTimeout(function(){

      window.location.href =
        "/";

    },1000);


  }
  catch(error){

    showMessage(
      "Invalid OTP. Please try again."
    );

  }

};

</script>

</body>
</html>
