/* EMAIL SIGNUP */

window.emailSignup =
async function(){

  const email =
    document.getElementById("email")
    .value
    .trim();

  const password =
    document.getElementById("password")
    .value;


  if(!email || !password){

    showMessage(
      "Enter email and password."
    );

    return;

  }


  if(password.length < 6){

    showMessage(
      "Password must be at least 6 characters."
    );

    return;

  }


  try{

    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );


    showMessage(
      "Account created successfully!",
      "#86efac"
    );


    setTimeout(function(){

      window.location.href =
        "/";

    },1500);


  }catch(error){

    showMessage(
      error.message
    );

  }

};

};


/* PHONE RECAPTCHA */

let confirmationResult;

let recaptchaVerifier;


window.sendOTP =
async function(){

  const countryCode =
    document.getElementById("countryCode")
    .value;

  const phone =
    document.getElementById("phone")
    .value
    .trim();


  if(!phone){

    showMessage(
      "Enter your phone number."
    );

    return;

  }


  const fullPhone =
    countryCode + phone;


  try{

    if(!recaptchaVerifier){

      recaptchaVerifier =
        new RecaptchaVerifier(
          auth,
          "recaptcha-container",
          {
            size:"normal"
          }
        );

    }


    confirmationResult =
      await signInWithPhoneNumber(
        auth,
        fullPhone,
        recaptchaVerifier
      );


    document
      .getElementById("otpSection")
      .style.display = "block";


    showMessage(
      "OTP sent successfully!",
      "#86efac"
    );


  }catch(error){

    showMessage(
      error.message
    );

  }

};


/* VERIFY OTP */

window.verifyOTP =
async function(){

  const otp =
    document.getElementById("otp")
    .value
    .trim();


  if(!otp){

    showMessage(
      "Enter OTP."
    );

    return;

  }


  try{

    await confirmationResult.confirm(
      otp
    );


    showMessage(
      "Phone verified successfully!",
      "#86efac"
    );


    setTimeout(function(){

      window.location.href = "/";

    },1000);


  }catch(error){

    showMessage(
      "Invalid OTP. Please try again."
    );

  }

};

</script>
